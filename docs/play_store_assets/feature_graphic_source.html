<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'sys';
    src: local('Malgun Gothic'), local('Apple SD Gothic Neo'), local('Segoe UI');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 55%, #4338ca 100%);
    font-family: 'sys', 'Malgun Gothic', sans-serif;
    overflow: hidden;
  }
  .wrap {
    position: relative;
    width: 1024px;
    height: 500px;
    display: flex;
    align-items: center;
    padding: 0 72px;
  }
  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.10) 2px, transparent 2px);
    background-size: 28px 28px;
  }
  .text {
    position: relative;
    z-index: 2;
    color: white;
    max-width: 620px;
  }
  .title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 18px;
  }
  .tagline {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.5;
    opacity: 0.95;
  }
  .badge {
    display: inline-block;
    margin-top: 28px;
    padding: 8px 18px;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    font-size: 18px;
    font-weight: 600;
  }
  .mascot {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    height: 420px;
    z-index: 2;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.25));
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="dots"></div>
    <div class="text">
      <div class="title">소셜런</div>
      <div class="tagline">내가 정한 학습 목표를,<br>완주할 때마다 별 하나, 나만의 시퀀스로</div>
      <div class="badge">AI 문제 생성 · 간격 반복 복습</div>
    </div>
    <img class="mascot" src="MASCOT_SRC" />
  </div>
</body>
</html>
