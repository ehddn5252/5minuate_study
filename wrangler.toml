name = "5minuatestudy"
main = "cloudflare_worker.js"
compatibility_date = "2024-09-23"

# Gemini API가 요청을 처리한 콜로 지역을 근거로 거부하는 경우가 있다("User location is not
# supported"). Smart Placement는 Worker가 호출하는 백엔드(Gemini)에 가까운 콜로에서 실행되도록
# 자동 배치하므로, 같은 요청 내 재시도(cloudflare_worker.js의 fetchGeminiWithRetry)가 항상
# 같은 콜로에 갇히는 문제를 완화할 수 있다. 무료 플랜에서도 사용 가능.
[placement]
mode = "smart"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "a0963576a5514b2bb9b8910be372ce4b"
